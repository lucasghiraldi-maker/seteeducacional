<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SETE Estúdio Educacional | Links</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,800;1,800&display=swap" rel="stylesheet">

    <style>
        /* Variáveis de Cores Baseadas na Logo */
        :root {
            --cor-laranja: #fe4d24; /* Laranja extraído da logo */
            --cor-fundo: #FAFAFA;
            --cor-texto: #333333;
            --cor-branca: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--cor-fundo);
            font-family: 'Montserrat', sans-serif;
            color: var(--cor-texto);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        /* Container principal estilo mobile */
        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Estilo da Logo */
        .logo-container {
            margin-bottom: 2.5rem;
            text-align: center;
        }

        .logo {
            max-width: 250px;
            width: 100%;
            height: auto;
            /* Um leve sombreamento para destacar a logo do fundo */
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.05)); 
        }

        /* Container dos Links */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem; /* Espaçamento entre os botões */
        }

        /* Estilo dos Botões */
        .link-btn {
            background-color: var(--cor-laranja);
            color: var(--cor-branca);
            text-decoration: none;
            padding: 1.2rem 1.5rem;
            border-radius: 8px;
            text-align: center;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(240, 78, 35, 0.2);
            border: 2px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Efeito ao passar o mouse ou tocar */
        .link-btn:hover, .link-btn:active {
            background-color: var(--cor-fundo);
            color: var(--cor-laranja);
            border: 2px solid var(--cor-laranja);
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(240, 78, 35, 0.3);
        }

        /* Rodapé */
        footer {
            margin-top: 3rem;
            font-size: 0.85rem;
            color: #888;
            font-style: italic;
            font-weight: 800;
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="logo-container">
            <img src="LOGO - SETE - FINAL-03.png" alt="Logo SETE Estúdio Educacional" class="logo">
        </header>

        <main class="links-container">
            <a href="https://wa.me/5562995180451?text=Oii%20gostaria%20de%20agendar%20uma%20aula%20particular%20especificamente%20com%20o%20professor%20Lucas%20Ghiraldi." class="link-btn">Agendamento de aulas particulares com prof. Lucas Ghiraldi</a>
            
            <a href="https://white-buffalo-622630.hostingersite.com/aulas-particulares" class="link-btn">Agendamento de aulas particulares em casa</a>
            
            <a href="https://white-buffalo-622630.hostingersite.com/curso-de-ferias" class="link-btn">Matrícula no curso UNIEVA/PUC de férias</a>
            
            <a href="https://white-buffalo-622630.hostingersite.com/curso-2-semestre" class="link-btn">Matricula no curso UNIEVA/PUC - 2° Semestre</a>
        
            <a href="https://white-buffalo-622630.hostingersite.com/curso-de-ferias" class="link-btn">Matrícula no curso de férias VUNESP/ENEM</a>

             <a href="https://white-buffalo-622630.hostingersite.com/duvidas" class="link-btn">Dúvidas sobre a plataforma VUNESP</a>
        </main>

        <footer>
            SETE ESTÚDIO EDUCACIONAL
        </footer>
    </div>

</body>
</html>
